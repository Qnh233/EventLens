[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventlens"
version = "0.1.0"
description = "EventLens baseline pipeline for listed-company event recognition and trusted alerting."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eventlens = ["web_index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

