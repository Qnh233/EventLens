random_state: 42
text:
  max_content_chars: 1200
  tfidf:
    analyzer: char_wb
    ngram_range: [2, 4]
    min_df: 1
    max_features: 60000
event_classifier:
  algorithm: logistic_regression
  no_event_labels: ["无事件", "无", "其他", "未识别"]
polarity_classifier:
  algorithm: logistic_regression
  fallback_label: "中性"

